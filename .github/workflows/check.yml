name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python tools/check_repo.py
